name: auto linter

on:
  push:
    paths:
      - '*.py'

jobs:
  code:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes back to the repo
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linter
        run: pip install ruff

      - name: Run Ruff linter with auto-fix
        run: ruff check --fix .

      - name: Commit auto-fixes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet || (git add . && git commit -m "style: auto-fix lint issues" && git push)
