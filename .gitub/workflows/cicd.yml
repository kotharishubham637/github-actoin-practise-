name: CICD
on:
  workflow_dispatch:
jobs:
  code:
     runs-on: ubuntu-latest
     steps:
       - name: clone the code
         run: echo "Cloning the code"
  build:
    needs: [code]  
    runs-on: ubuntu-latest
     steps:
       - name: Build using docker
         run: echo "building using docker"
  test:
    needs: [build]  
    runs-on: ubuntu-latest
     steps:
       - name: test the code
         run: echo "test the code"
  deploy:
    needs: [build,test]  
    runs-on: ubuntu-latest
     steps:
       - name: deploying the code
         run: echo "Deploying the code"
